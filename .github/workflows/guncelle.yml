name: Verileri güncelle ve yayınla

on:
  schedule:
    - cron: "17 4,16 * * *"   # her gün 07:17 ve 19:17 (TSİ)
  workflow_dispatch:
  issues:
    types: [labeled]   # bildirime "onaylandı" etiketi eklenince uygulanır
  push:
    branches: [main]
    paths: ["data/kaynak/**", "pipeline/**", "site/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    if: github.event_name != 'issues' || github.event.label.name == 'onaylandı'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Onaylanan bildirimi uygula
        if: github.event_name == 'issues'
        run: python -m pipeline.duzeltme "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/bildirim_sonuc.txt"

      - name: Topla, karşılaştır, siteyi üret
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOMINATIM_USER_AGENT: kamu-misafirhaneleri (github.com/${{ github.repository }})
        run: python -m pipeline.run

      - name: Değişen verileri depoya kaydet
        run: |
          git config user.name "misafirhane-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Veri güncellemesi $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: yayin
        uses: actions/deploy-pages@v4

      - name: Bildirimi yanıtla ve kapat
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          SAYI: ${{ github.event.issue.number }}
        run: |
          SONUC="$(cat "$RUNNER_TEMP/bildirim_sonuc.txt")"
          if [[ "$SONUC" == "⚠️"* ]]; then
            gh issue comment "$SAYI" --repo "$GITHUB_REPOSITORY" --body "$SONUC"$'\n\nBildirimi düzeltip etiketi kaldırıp yeniden ekleyebilirsiniz.'
          else
            gh issue close "$SAYI" --repo "$GITHUB_REPOSITORY" --comment "$SONUC"$'\n\nSite güncellendi: ${{ steps.yayin.outputs.page_url }}\nTeşekkürler!'
          fi
