name: Verileri güncelle ve yayınla

on:
  schedule:
    - cron: "17 4,16 * * *"   # her gün 07:17 ve 19:17 (TSİ)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/kaynak/**", "pipeline/**", "site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Topla, karşılaştır, siteyi üret
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOMINATIM_USER_AGENT: kamu-misafirhaneleri (github.com/${{ github.repository }})
        run: python -m pipeline.run

      - name: Değişen verileri depoya kaydet
        run: |
          git config user.name "misafirhane-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Veri güncellemesi $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: yayin
        uses: actions/deploy-pages@v4
